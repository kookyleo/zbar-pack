name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            use-cross: true

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            use-cross: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      if: matrix.use-cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux' && !matrix.use-cross
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev clang musl-tools

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install llvm

    - name: Build
      run: |
        if [ "${{ matrix.use-cross }}" = "true" ]; then
          cross build --release --target ${{ matrix.target }}
        else
          cargo build --release --target ${{ matrix.target }}
        fi
      shell: bash

    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../zbar-pack-${{ matrix.target }}.tar.gz \
          libzbar_pack.* examples/simple* || true
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zbar-pack-${{ matrix.target }}
        path: zbar-pack-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          zbar-pack-*/zbar-pack-*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
