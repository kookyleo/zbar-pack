[package]
name = "zbar-src"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/kookyleo/zbar-pack"
documentation = "https://docs.rs/zbar-src"
description = "Bundled ZBar C library source code for static linking"
readme = "../README.md"
build = "build.rs"
links = "zbar-vendored"
exclude = [
    "target/",
    ".git/",
    "vendor/zbar-*/doc/",
    "vendor/zbar-*/examples/",
    "vendor/zbar-*/test/",
    "vendor/zbar-*/android/",
    "vendor/zbar-*/iphone/",
    "vendor/zbar-*/java/",
    "vendor/zbar-*/perl/",
    "vendor/zbar-*/python/",
    "vendor/zbar-*/pygtk/",
    "vendor/zbar-*/qt/",
    "vendor/zbar-*/gtk/",
    "vendor/zbar-*/plugin/",
    "vendor/zbar-*/.git*",
]

[features]
default = ["vendored"]
vendored = []

# Codec feature flags - for reducing binary size
codec-ean = []
codec-databar = []
codec-code128 = []
codec-code93 = []
codec-code39 = []
codec-codabar = []
codec-i25 = []
codec-qrcode = []
codec-sqcode = []

# Default common codecs enabled
minimal = []
all-codecs = [
    "codec-ean",
    "codec-databar",
    "codec-code128",
    "codec-code93",
    "codec-code39",
    "codec-codabar",
    "codec-i25",
    "codec-qrcode",
    "codec-sqcode",
]

[build-dependencies]
cc.workspace = true
pkg-config.workspace = true
